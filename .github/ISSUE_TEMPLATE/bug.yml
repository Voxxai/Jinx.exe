name: Bug report
description: Report reproducible broken behavior
title: 'fix: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Jinx.exe. Never include secrets or viewer data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Start the app\n2. Connect...\n3. Trigger..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove usernames, tokens and personal data before pasting logs.
      render: shell
