[package]
name = "jinx-exe"
version = "0.1.0"
description = "A chaotic stream-aware desktop companion"
authors = ["Voxxai"]
edition = "2021"

[lib]
name = "jinx_exe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
